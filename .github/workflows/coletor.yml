name: Coletor de Dados e Notícias

on:
  schedule:
    # Roda a cada 30 minutos, das 10h às 19h (horário de Brasília = UTC-3)
    # UTC 13:00-22:00 = BRT 10:00-19:00 (durante pregão + margem)
    - cron: '*/30 13-22 * * 1-5'
    # Fora do horário comercial: 1x por hora
    - cron: '0 0-12,23 * * 1-5'
    # Fins de semana: a cada 3 horas, das 9h às 21h UTC (6h às 18h BRT)
    - cron: '0 9,12,15,18,21 * * 0,6'
  workflow_dispatch: # Permite rodar manualmente

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: atualizacao-dados
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Rodar coletor de dados e notícias
        run: python coletor.py
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Validar JSON gerado
        run: |
          python -m json.tool dados.json > /dev/null
          python -m json.tool noticias.json > /dev/null
          python -m json.tool materias.json > /dev/null

      - name: Commit e Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados.json noticias.json materias.json
          git diff --staged --quiet || git commit -m "Atualização automática $(date +'%d/%m %H:%M UTC')"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
